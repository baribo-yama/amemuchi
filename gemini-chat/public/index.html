<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amemuchi chat</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap">
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Amemuchi Chat</h1>
        <button id="new-chat" type="button" class="ghost">新規チャット</button>
      </header>

      <p class="lead">今日のあなたを<br>褒めて、叱ります。</p>

      <p class="down">いま思っていることを書いてください。甘く、ときに厳しく、返事をします</p>

      <section class="explanation">
        <div class="card ame">あめ
          <p class="note">がんばりを認めて、背中を押す。</p>
        </div>

        <div class="card muchi">むち
          <p class="note">甘えを見逃さず、ビシッと<br>指摘する。</p>
        </div>
      </section>

      <form id="form" class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="メッセージを入力(Enterで送信 / Shift+Enterで改行)"
          autofocus
        ></textarea>
        <button id="send" type="submit">送信</button>
      </form>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
