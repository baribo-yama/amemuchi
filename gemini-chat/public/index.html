<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amemuchi chat</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Amemuchi Chat</h1>
        <button id="new-chat" type="button" class="ghost">新規チャット</button>
      </header>

      <div class="muchi-face">
        <p class="lead">今日のあなたを<br />褒めて、叱ります。</p>
        <img
          class="head"
          src="./image/muchimuchi-face.png"
          alt="むちむちくん"
        />
      </div>

      <p class="down">
        いま思っていることを書いてください。甘く、ときに厳しく、返事をします
      </p>

      <section class="explanation">
        <div class="card ame">
          あめ
          <p class="note">がんばりを認めて、背中を押す。</p>
        </div>

        <div class="card muchi">
          <!-- <img class="muchi-img" src="./image/muchi.jpg" alt="むちの画像" /> -->

          むち

          <p class="note">甘えを見逃さず、ビシッと<br />指摘する。</p>
        </div>
      </section>

      <div class="log">
        <label for="input">メッセージ</label>
        <button type="button" id="log-button" class="ghost">ログ</button>
      </div>

      <form id="form" class="composer">
        <textarea
          id="input"
          rows="5"
          placeholder="今日あったこと、悩み、理想など・・・"
          autofocus
        ></textarea>
        <div class="send">
          <span class="message"
            >メッセージを入力(Enterで送信 / Shift+Enterで改行)</span
          ><button id="send" type="submit">送信</button>
        </div>
      </form>
    </div>
    <div id="log-box"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
